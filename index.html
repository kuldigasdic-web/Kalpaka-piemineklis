<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.01;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Ielādē 3D modeli .glb formātā -->
        <a-asset-item id="mansModelis" src="./modelis.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <!-- 
          scale: 3D modeļi mēdz būt milzīgi vai ļoti mazi. Pielāgo (piem., 0.1 0.1 0.1 vai 0.5 0.5 0.5)
          rotation: "90 0 0" pagriež objektu, lai tas "stāvētu" uz kartītes, nevis gulētu plakaniski
        -->
        <a-gltf-model 
          src="#mansModelis" 
          position="0 0 0.1" 
          scale="0.2 0.2 0.2" 
          rotation="90 0 0">
        </a-gltf-model>
      </a-entity>
    </a-scene>
  </body>
</html>
